# ----------------------------------------------------
# Configuración específica para el perfil 'test'
# ----------------------------------------------------

spring:
  datasource:
    # URL de H2 en memoria para que se destruya después de cada suite de tests
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    # DDL para que recree las tablas en cada test
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        
  # IMPORTANTE: Desactivar el fail-fast. Si el Config Server no responde, 
  # la aplicación no fallará inmediatamente, aunque en el test lo mantendrás activo.
  cloud:
    config:
      fail-fast: false
